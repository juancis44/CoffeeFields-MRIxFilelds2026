task: 2
task_name: task2_0.1T_to_3T_T1W
method: nafnet_gan

model:
  input_nc: 5
  output_nc: 1
  width: 32
  enc_blk_nums: [2, 2, 4]
  middle_blk_num: 6
  dec_blk_nums: [2, 2, 2]
  global_residual: true
  drop: 0.0

disc:
  ndf: 64
  n_layers: 3
  gan_mode: lsgan

data:
  modality: T1W
  source_field: 0.1T
  target_field: 3T
  paired_split: pro_val
  pair_by: order          # Validating_prospective uses different ids per field -> pair by sorted order   # Training_prospective is prohibited -> use Validating_prospective as the paired set
  n_neighbors: 2
  val_holdout: 1         # only 3 paired subjects in pro_val -> train on 2, validate on 1

loss:
  l1: 1.0
  ssim: 1.0
  edge: 0.1
  lpips: 0.1
  adv: 0.05             # weak adversarial -> sharpen without hurting nRMSE
  mind: 0.5             # structure-consistency -> protect Dice/Volume
  mind_radius: 2

train:
  batch_size: 8
  num_workers: 8
  cache: true
  amp: true
  ema_decay: 0.999
  wd: 1.0e-4
  print_every: 100
  val_every: 5
  val_lpips: true
  # Fase 3 is a single refinement phase on REAL pairs (warm-start from Fase 2)
  pretrain_epochs: 0
  finetune_epochs: 60
  finetune_lr: 5.0e-5    # lower LR: refining, not training from scratch
  disc_lr: 1.0e-4
